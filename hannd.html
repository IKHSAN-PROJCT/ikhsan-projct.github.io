<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>IMO Hand Gesture Detector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #00ffff;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      z-index: 10;
      white-space: pre-line;
    }

    video, canvas {
      display: none;
    }

    #indicator {
      position: fixed;
      left: 14px;
      bottom: 14px;
      padding: 8px 12px;
      border: 1px solid #00ffff;
      border-radius: 20px;
      color: #00ffff;
      font-size: 12px;
      background: rgba(0, 30, 35, 0.8);
    }
  </style>
</head>

<body>
  <div id="status">Memuat library deteksi tangan...</div>

  <div id="indicator">IMO • Kamera belum aktif</div>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <canvas id="output"></canvas>

  <script>
    "use strict";

    const statusElement =
      document.getElementById("status");

    const indicatorElement =
      document.getElementById("indicator");

    const video =
      document.getElementById("camera");

    let lastGesture = "";
    let detectorReady = false;
    let hands = null;
    let processing = false;
    let lastStatus = "";

    // Mencegah selfie diminta berulang kali.
    let selfieRequested = false;

    function setStatus(message) {
      if (message !== lastStatus) {
        statusElement.textContent = message;
        lastStatus = message;
      }
    }

    function setIndicator(message) {
      indicatorElement.textContent = message;
    }

    // Mengirim gestur ke MainActivity Android.
    function sendGesture(gesture) {
      if (
        window.AndroidBridge &&
        typeof window.AndroidBridge.onGesture === "function"
      ) {
        try {
          window.AndroidBridge.onGesture(gesture);
        } catch (error) {
          console.error("AndroidBridge error:", error);
        }
      } else {
        console.warn(
          "AndroidBridge belum tersedia. Gestur:",
          gesture
        );
      }
    }

    // Hanya kirim ketika gestur berubah.
    function reportGesture(gesture) {
      if (gesture === lastGesture) return;

      lastGesture = gesture;
      sendGesture(gesture);
    }

    // Pemeriksaan posisi jari.
    function fingerUp(landmarks, tip, pip) {
      return landmarks[tip].y < landmarks[pip].y;
    }

    // Pose pistol.
    function detectPistol(landmarks) {
      const indexUp = fingerUp(landmarks, 8, 6);
      const middleUp = fingerUp(landmarks, 12, 10);
      const ringUp = fingerUp(landmarks, 16, 14);
      const pinkyUp = fingerUp(landmarks, 20, 18);

      const thumbTip = landmarks[4];
      const thumbJoint = landmarks[3];

      const thumbOut =
        Math.abs(thumbTip.x - thumbJoint.x) > 0.035;

      return indexUp &&
             !middleUp &&
             !ringUp &&
             !pinkyUp &&
             thumbOut;
    }

    // Deteksi jempol ke atas.
    function detectThumbsUp(landmarks) {
      const thumbTip = landmarks[4];
      const thumbIp = landmarks[3];
      const thumbMcp = landmarks[2];
      const wrist = landmarks[0];

      const indexFolded =
        landmarks[8].y > landmarks[6].y;

      const middleFolded =
        landmarks[12].y > landmarks[10].y;

      const ringFolded =
        landmarks[16].y > landmarks[14].y;

      const pinkyFolded =
        landmarks[20].y > landmarks[18].y;

      const thumbUp =
        thumbTip.y < thumbIp.y - 0.025 &&
        thumbIp.y < thumbMcp.y + 0.04 &&
        thumbTip.y < wrist.y - 0.08;

      return thumbUp &&
             indexFolded &&
             middleFolded &&
             ringFolded &&
             pinkyFolded;
    }

    // Deteksi gerakan menarik pelatuk.
    function detectShot(landmarks) {
      const indexTip = landmarks[8];
      const indexPip = landmarks[6];
      const indexMcp = landmarks[5];

      const indexBent =
        indexTip.y > indexPip.y &&
        indexPip.y > indexMcp.y;

      const middleFolded =
        landmarks[12].y > landmarks[10].y;

      const ringFolded =
        landmarks[16].y > landmarks[14].y;

      const pinkyFolded =
        landmarks[20].y > landmarks[18].y;

      return indexBent &&
             middleFolded &&
             ringFolded &&
             pinkyFolded;
    }

    // Memuat library eksternal.
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = url;
        script.async = true;
        script.onload = resolve;

        script.onerror = () => {
          reject(
            new Error("Gagal memuat library: " + url)
          );
        };

        document.head.appendChild(script);
      });
    }

    /*
     * Dipanggil MainActivity melalui evaluateJavascript().
     * Mengambil gambar dari video kamera depan yang sudah aktif.
     */
    window.captureSelfieForIMO = function () {
      try {
        if (
          !video ||
          !video.videoWidth ||
          !video.videoHeight ||
          !video.srcObject
        ) {
          if (
            window.AndroidBridge &&
            typeof window.AndroidBridge.onSelfieCaptureFailed ===
              "function"
          ) {
            window.AndroidBridge.onSelfieCaptureFailed();
          }

          return;
        }

        const canvas = document.createElement("canvas");

        // Batasi resolusi agar transfer gambar lebih ringan.
        const maxWidth = 720;

        const ratio = Math.min(
          1,
          maxWidth / video.videoWidth
        );

        canvas.width = Math.round(
          video.videoWidth * ratio
        );

        canvas.height = Math.round(
          video.videoHeight * ratio
        );

        const context = canvas.getContext("2d");

        if (!context) {
          throw new Error("Canvas tidak tersedia.");
        }

        // Cerminkan gambar agar tampak seperti selfie.
        context.translate(canvas.width, 0);
        context.scale(-1, 1);

        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const photo = canvas.toDataURL(
          "image/jpeg",
          0.82
        );

        if (
          window.AndroidBridge &&
          typeof window.AndroidBridge.onSelfieCaptured ===
            "function"
        ) {
          window.AndroidBridge.onSelfieCaptured(photo);
        } else {
          console.error(
            "AndroidBridge.onSelfieCaptured tidak tersedia."
          );
        }

      } catch (error) {
        console.error("Gagal mengambil selfie:", error);

        if (
          window.AndroidBridge &&
          typeof window.AndroidBridge.onSelfieCaptureFailed ===
            "function"
        ) {
          window.AndroidBridge.onSelfieCaptureFailed();
        }
      }
    };

    async function startDetector() {
      try {
        setStatus("1/4 Memuat MediaPipe Hands...");

        await loadScript(
          "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        );

        if (typeof Hands === "undefined") {
          throw new Error(
            "Library MediaPipe Hands tidak tersedia."
          );
        }

        setStatus("2/4 Menyiapkan model deteksi tangan...");

        hands = new Hands({
          locateFile: (file) =>
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
            file
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
          if (!detectorReady) return;

          const list = results.multiHandLandmarks;

          if (!list || list.length === 0) {
            reportGesture("none");

            // Izinkan gestur jempol berikutnya setelah tangan
            // tidak terdeteksi lagi.
            selfieRequested = false;

            setStatus(
              "Kamera aktif — tangan tidak terdeteksi."
            );

            setIndicator("IMO • Menunggu gestur");
            return;
          }

          const landmarks = list[0];

          // Prioritas 1: gestur tembakan.
          if (detectShot(landmarks)) {
            reportGesture("shot");

            setStatus(
              "DOR! Gestur tembakan terdeteksi!"
            );

            setIndicator("IMO • Gestur tembakan");

          // Prioritas 2: jempol ke atas.
          } else if (detectThumbsUp(landmarks)) {
            reportGesture("thumbs_up");

            setStatus(
              "👍 Jempol terdeteksi!\n" +
              "IMO sedang mengambil selfie..."
            );

            setIndicator("IMO • Selfie");

            // Jangan mengirim permintaan terus-menerus
            // selama jempol masih terlihat.
            if (!selfieRequested) {
              selfieRequested = true;
            }

          // Prioritas 3: pose pistol.
          } else if (detectPistol(landmarks)) {
            reportGesture("pistol");

            setStatus(
              "Pose pistol terdeteksi!\n" +
              "Ampun, Bang Ikhsan..."
            );

            setIndicator("IMO • Pose pistol");

          } else {
            reportGesture("none");

            // Tangan masih terlihat, tetapi pose berubah.
            selfieRequested = false;

            setStatus(
              "Kamera aktif — tangan terdeteksi."
            );

            setIndicator("IMO • Kamera aktif");
          }
        });

        setStatus("3/4 Meminta izin kamera...");

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            "Akses kamera tidak tersedia. " +
            "Gunakan HTTPS atau WebView Android " +
            "yang mendukung kamera."
          );
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: "user",
              width: { ideal: 640 },
              height: { ideal: 480 },
              frameRate: { ideal: 24, max: 30 }
            }
          });

        video.srcObject = stream;
        await video.play();

        setStatus(
          "4/4 Kamera aktif, memulai deteksi..."
        );

        setIndicator("IMO • Kamera aktif");

        detectorReady = true;

        async function processFrame() {
          if (!detectorReady) return;

          if (
            video.readyState >= 2 &&
            !processing
          ) {
            processing = true;

            try {
              await hands.send({ image: video });
            } catch (error) {
              console.error(
                "Kesalahan deteksi:",
                error
              );

              setStatus(
                "Deteksi gagal: " + error.message
              );
            } finally {
              processing = false;
            }
          }

          if (detectorReady) {
            requestAnimationFrame(processFrame);
          }
        }

        processFrame();

      } catch (error) {
        detectorReady = false;

        console.error(error);

        setStatus("ERROR: " + error.message);

        setIndicator("IMO • Terjadi kesalahan");

        reportGesture("none");
      }
    }

    window.addEventListener("load", () => {
      if (!window.isSecureContext) {
        setStatus(
          "ERROR: Halaman harus dibuka melalui HTTPS " +
          "atau konteks lokal yang aman."
        );

        return;
      }

      startDetector();
    });

    window.addEventListener("error", (event) => {
      console.error(
        "JavaScript error:",
        event.message
      );
    });

    window.addEventListener(
      "unhandledrejection",
      (event) => {
        console.error(
          "Promise error:",
          event.reason
        );

        setStatus(
          "ERROR: " +
          (
            event.reason?.message ||
            String(event.reason)
          )
        );
      }
    );
  </script>
</body>
</html>
