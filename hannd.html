
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture Detector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #00ffff;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      z-index: 10;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>

<body>
  <div id="status">Memuat library deteksi tangan...</div>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="output"></canvas>

  <script>
    const statusElement = document.getElementById("status");

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function sendGesture(gesture) {
      if (
        window.AndroidBridge &&
        typeof window.AndroidBridge.onGesture === "function"
      ) {
        try {
          window.AndroidBridge.onGesture(gesture);
        } catch (error) {
          console.error("AndroidBridge error:", error);
        }
      }
    }

    let lastGesture = "";
    let detectorReady = false;
    let hands = null;
    let processing = false;

    function reportGesture(gesture) {
      if (gesture === lastGesture) return;

      lastGesture = gesture;
      sendGesture(gesture);
    }

    // Pemeriksaan sederhana apakah jari mengarah ke atas.
    function fingerUp(landmarks, tip, pip) {
      return landmarks[tip].y < landmarks[pip].y;
    }

    function detectPistol(landmarks) {
      const indexUp = fingerUp(landmarks, 8, 6);
      const middleUp = fingerUp(landmarks, 12, 10);
      const ringUp = fingerUp(landmarks, 16, 14);
      const pinkyUp = fingerUp(landmarks, 20, 18);

      const thumbTip = landmarks[4];
      const thumbJoint = landmarks[3];

      const thumbOut =
        Math.abs(thumbTip.x - thumbJoint.x) > 0.035;

      return indexUp &&
             !middleUp &&
             !ringUp &&
             !pinkyUp &&
             thumbOut;
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.async = true;

        script.onload = resolve;
        script.onerror = () => {
          reject(new Error("Gagal memuat library: " + url));
        };

        document.head.appendChild(script);
      });
    }

    async function startDetector() {
      const video = document.getElementById("camera");

      try {
        setStatus("1/4 Memuat MediaPipe...");

        await loadScript(
          "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        );

        if (typeof Hands === "undefined") {
          throw new Error("Library MediaPipe Hands tidak tersedia.");
        }

        setStatus("2/4 Menyiapkan model tangan...");

        hands = new Hands({
          locateFile: (file) =>
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
          if (!detectorReady) return;

          const list = results.multiHandLandmarks;

          if (!list || list.length === 0) {
            reportGesture("none");
            setStatus("Kamera aktif — tangan tidak terdeteksi.");
            return;
          }

          if (detectPistol(list[0])) {
            reportGesture("pistol");
            setStatus("Pose pistol terdeteksi!");
          } else {
            reportGesture("none");
            setStatus("Kamera aktif — tangan terdeteksi.");
          }
        });

        setStatus("3/4 Meminta izin kamera...");

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Akses kamera tidak tersedia. Gunakan HTTPS dan WebView yang mendukung kamera."
          );
        }

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: "user",
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          });

        video.srcObject = stream;
        await video.play();

        setStatus("4/4 Kamera aktif, memulai deteksi...");

        detectorReady = true;

        async function processFrame() {
          if (!detectorReady) return;

          if (video.readyState >= 2 && !processing) {
            processing = true;

            try {
              await hands.send({ image: video });
            } catch (error) {
              console.error("Kesalahan deteksi:", error);
              setStatus("Deteksi gagal: " + error.message);
            } finally {
              processing = false;
            }
          }

          requestAnimationFrame(processFrame);
        }

        processFrame();

      } catch (error) {
        detectorReady = false;
        console.error(error);

        setStatus("ERROR: " + error.message);
        reportGesture("none");
      }
    }

    window.addEventListener("load", () => {
      if (!window.isSecureContext) {
        setStatus("ERROR: Halaman harus dibuka melalui HTTPS.");
        return;
      }

      startDetector();
    });

    window.addEventListener("error", (event) => {
      console.error("JavaScript error:", event.message);
    });

    window.addEventListener("unhandledrejection", (event) => {
      console.error("Promise error:", event.reason);
      setStatus(
        "ERROR: " +
        (event.reason?.message || String(event.reason))
      );
    });
  </script>
</body>
</html>
